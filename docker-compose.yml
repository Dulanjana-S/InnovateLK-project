services:
  mongo:
    image: mongo:7
    container_name: innovatelk-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: innovatelk-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      MONGODB_URI: mongodb://mongo:27017/innovatelk
      JWT_SECRET: change-me-access-secret
      JWT_EXPIRATION: 7d
      JWT_REFRESH_SECRET: change-me-refresh-secret
      JWT_REFRESH_EXPIRATION: 30d
      OPENAI_API_KEY: ""
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    container_name: innovatelk-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
  uploads_data:
